name: CI_Actions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-lt
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-lt/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Lint
        run: npm run lint
        
      - name: Type check and build
        run: npm run build

