name: CI_Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: portfolio-lt

    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: portfolio-lt/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: portfolio-lt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `pnpm run build` runs `tsc -b` and then `vite build`,
      # so this covers type checking and the production bundle.
      - name: Type check and build
        run: pnpm run build

      # When Vitest is set up and a "test" script exists in package.json:
      # - name: Unit tests
      #   run: pnpm test --run

      # When Playwright is set up (add a "test:e2e" script):
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps chromium
      # - name: E2E tests
      #   run: pnpm run test:e2e
      # - uses: actions/upload-artifact@v4
      #   if: failure()
      #   with:
      #     name: playwright-report
      #     path: portfolio-lt/playwright-report

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: portfolio-lt/dist
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: portfolio-lt

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: portfolio-lt/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolio-lt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: portfolio-lt/dist

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}