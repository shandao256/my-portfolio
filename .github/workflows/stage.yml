name: CI_Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: portfolio-lt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-lt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` and then `vite build`,
      # so this covers type checking and the production bundle.
      - name: Type check and build
        run: npm run build

      # When Vitest is set up and a "test" script exists in package.json:
      # - name: Unit tests
      #   run: npm test -- --run

      # When Playwright is set up (add a "test:e2e" script):
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps chromium
      # - name: E2E tests
      #   run: npm run test:e2e
      # - uses: actions/upload-artifact@v4
      #   if: failure()
      #   with:
      #     name: playwright-report
      #     path: portfolio-lt/playwright-report

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: portfolio-lt/dist
          retention-days: 7

  deploy:
    needs: check
    # Runs only on pushes to main, and only once you flip the switch:
    # repo -> Settings -> Secrets and variables -> Actions -> Variables -> DEPLOY_ENABLED = true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: portfolio-lt/dist

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portfolio-lt
          command: deploy